services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Member host is "localhost:27017" (not the Docker-network name "mongo:27017") because
  # Phase 0's apps/api runs directly on the host, not in this compose network — see
  # docs/superpowers/plans/2026-10-08-phase0-foundation.md ledger, Task 5 ruling, for why
  # "mongo:27017" hangs the driver's replica-set discovery when connecting from the host.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo
      - --quiet
      - --eval
      - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}) }"

volumes:
  mongo_data:
